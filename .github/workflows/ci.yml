name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  checks: write
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run test:ci

      - name: Publish Jest results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Jest Unit Tests
          path: reports/junit/jest-results.xml
          reporter: jest-junit
          fail-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: jest-coverage
          path: coverage/jest/
          retention-days: 14

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npm run e2e:ci
        env:
          CI: true

      - name: Publish Playwright results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Playwright E2E Tests
          path: playwright-results/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
