<ion-card (click)="itemSelected(report)">
  @if (report.Images) {
    <swiper-container>
      @for (url of report.Images; track url) {
        <swiper-slide class="image-slide" [ngStyle]="{'background-image':'url('+url+')'}">
          <img [src]="url" style="display:none;" />
        </swiper-slide>
      }
    </swiper-container>
  }

  @if (!report.Images) {
    <div class="default-image-bg"></div>
  }

  <ion-card-content>

    <ion-row>
      <ion-col size="11" class="ion-no-padding ion-text-left">
        <h2>{{ report.TripName }}</h2>
      </ion-col>
      @if (report.Visited) {
        <ion-col size="1" class="ion-no-padding ion-text-right">
          <ion-icon name="eye" class="eye-icon"></ion-icon>
        </ion-col>
      }
    </ion-row>

    <ion-row>
      <ion-col class="ion-no-padding ion-text-left">{{report.Region}}</ion-col>
      <ion-col class="ion-no-padding ion-text-center">{{report.ElevationGain}} m.</ion-col>
      <ion-col class="ion-no-padding ion-text-center">{{report.DownhillSide}}</ion-col>
      <ion-col class="ion-no-padding ion-text-right">{{report.ReadableDate}}</ion-col>
    </ion-row>

  </ion-card-content>
</ion-card>
