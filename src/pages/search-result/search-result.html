<ion-header>
  <ion-toolbar>
    <ion-title>{{ 'SEARCH_RESULT.TITLE' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="displaySearchResultOnMap()">
        <ion-icon slot="icon-only" name="map"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-no-padding">

  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @for (report of shared.reportsSearchResults; track report) {
    <report [report]="report"></report>
  }

  <ion-infinite-scroll (ionInfinite)="doInfinite($event)" [disabled]="infiniteDisabled">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
