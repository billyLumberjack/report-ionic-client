<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <div class="title-report-container">
        <div class="title-report-name">
          {{report.TripName}}
        </div>
        <div class="title-report-date">
          {{report.ReadableDate}}
        </div>
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <map *ngIf="report.geometry && report.geometry.coordinates"></map>

  <ion-list *ngIf="report">
    <div *ngFor="let key of fieldsToShow">
      <ion-item class="ion-text-wrap" *ngIf="report[key]">
        <ion-label class="ion-text-wrap">
          <p>{{ 'DETAILS.'+key | translate }}</p>
          <h2>{{report[key]}}</h2>
        </ion-label>
      </ion-item>
    </div>
  </ion-list>

  <div *ngIf="report.Images">
    <ion-grid>
      <ion-row>
        <ion-col size="6" *ngFor="let image of report.Images; let idx = index">
          <img class="image-container" (click)="gotoSlide(idx)" [src]="image" />
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

</ion-content>
