<ion-header>
  <ion-toolbar class="dark-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/report-details"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="tutorial-page">
  <swiper-container #swiperRef pagination="true" zoom="true" class="full-height-swiper">
    <swiper-slide *ngFor="let slide of slides">
      <div class="swiper-zoom-container"><img [src]="slide" class="slide-image" /></div>
    </swiper-slide>
  </swiper-container>
</ion-content>
