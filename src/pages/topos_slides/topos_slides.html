<ion-header>
  <ion-toolbar class="dark-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/report-details"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="tutorial-page" scroll-y="false">
  <swiper-container #swiperRef pagination="true" zoom="true" keyboard="true" class="full-height-swiper">
    @for (slide of slides; track slide) {
      <swiper-slide>
        <div class="swiper-zoom-container"><img [src]="slide" class="slide-image" /></div>
      </swiper-slide>
    }
  </swiper-container>
</ion-content>
